name: CI

on:
  push:
    branches: [main]
  # Every PR, including PRs stacked on other branches.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported toolchains: go.mod's floor through the latest release.
        go: ['1.25', '1.26', '1.27']
    env:
      # Build with exactly the matrix toolchain. Without this a dependency
      # declaring a newer go line would silently switch toolchains.
      GOTOOLCHAIN: local
      RUNNERQ_TEST_DSN: postgres://postgres:test@localhost:5432/runnerq_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: runnerq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # `go build ./...` compiles every package + every `main` in examples,
      # which is the bar we already enforce locally before each commit.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The conductor agent is its own module (conductor/go.mod), so the SDK
      # doesn't depend on what only the agent needs.
      - name: Build and vet the conductor module
        run: go -C conductor build ./... && go -C conductor vet ./...

      # OpenTelemetry support is its own module (otel/go.mod), so the SDK
      # depends on no OpenTelemetry package.
      - name: Build and vet the otel module
        run: go -C otel build ./... && go -C otel vet ./...

      # internal/spec and the conductor's wire types are generated from the
      # pinned runnerq-spec submodule.
      - name: Generated spec code is current
        if: matrix.go == '1.27'
        run: go generate ./internal/spec && go -C conductor generate ./internal/wire && git diff --exit-code

      # gofmt check — fails the job if any tracked .go file would be
      # rewritten. Cheap and catches accidental mis-formatting before review.
      - name: gofmt
        if: matrix.go == '1.27'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # Integration tests run against the postgres service container and are
      # skipped automatically when RUNNERQ_TEST_DSN is unset (e.g. locally
      # without a database). -race is non-negotiable for an engine this
      # concurrency-heavy.
      - name: Test
        run: go test ./... -race -count=1 -timeout=5m && go -C conductor test ./... -race -count=1 -timeout=5m && go -C otel test ./... -race -count=1 -timeout=5m

      # runnerq-spec's cross-language scenarios, through this SDK's driver.
      - name: Conformance
        run: |
          go build -o "$RUNNER_TEMP/conformancedriver" ./internal/conformancedriver
          go run -C spec/tools/conformance . -v -driver go="$RUNNER_TEMP/conformancedriver"

  postgres:
    name: Postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Postgres major still supported upstream.
        postgres: ['14', '15', '16', '17', '18']
    env:
      GOTOOLCHAIN: local
      RUNNERQ_TEST_DSN: postgres://postgres:test@localhost:5432/runnerq_test
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: runnerq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Test
        run: go test ./... -race -count=1 -timeout=5m && go -C conductor test ./... -race -count=1 -timeout=5m

      - name: Conformance
        run: |
          go build -o "$RUNNER_TEMP/conformancedriver" ./internal/conformancedriver
          go run -C spec/tools/conformance . -v -driver go="$RUNNER_TEMP/conformancedriver"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The latest patch release, so standard-library findings reflect what a
      # current toolchain ships.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: SDK
        run: govulncheck ./...

      - name: Conductor
        run: govulncheck -C conductor ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0

      # Covers the SDK and the conductor module. Exclusions:
      # - G115 (integer conversion overflow): the conversions are between the
      #   API's unsigned counts and durations and Postgres's signed integer
      #   columns, with values far inside both ranges.
      # - examples/: runnable demos, not part of the importable API.
      # - spec/: the runnerq-spec submodule, scanned in its own repository.
      # Individual findings that are intended carry a `#nosec <rule> -- reason`.
      - name: gosec
        run: gosec -exclude=G115 -exclude-dir=examples -exclude-dir=spec ./...

  upgrade:
    name: Upgrade from previous SDK
    runs-on: ubuntu-latest
    env:
      RUNNERQ_TEST_DSN: postgres://postgres:test@localhost:5432/runnerq_test
      # Override with the repository variable UPGRADE_FROM (any git ref).
      UPGRADE_FROM: ${{ vars.UPGRADE_FROM }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: runnerq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The previous SDK may need a newer toolchain than the floor; let it
      # switch (GOTOOLCHAIN is left at auto).
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      # The previous SDK is the latest release tag from v0.6.0 on. Releases
      # before v0.6.0 predate the runnerq-spec schema and cannot be upgraded
      # in place, so until v0.6.0 is tagged it is the merge base with main.
      - name: Choose the previous SDK
        run: |
          ref="$UPGRADE_FROM"
          if [ -z "$ref" ]; then
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            if [ -n "$tag" ] && [ "$(printf '%s\nv0.6.0\n' "$tag" | sort -V | head -1)" = v0.6.0 ]; then
              ref="$tag"
            else
              ref=$(git merge-base HEAD origin/main)
            fi
          fi
          echo "Upgrading from $ref"
          echo "RUNNERQ_UPGRADE_FROM=$ref" >> "$GITHUB_ENV"

      - name: Upgrade test
        run: go test ./internal/upgradetest -run TestUpgradeFromPreviousSDK -count=1 -v -timeout=5m
