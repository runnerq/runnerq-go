version: 2
updates:
  # Go 1.25 is the floor: CI builds on it with GOTOOLCHAIN=local, so an
  # update that raises go.mod's go line fails the Go 1.25 job.
  - package-ecosystem: gomod
    directories:
      - /
      - /conductor
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ['*']
    labels: [deps]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    labels: [deps]

  # The spec submodule is pinned on purpose, usually to a branch commit;
  # these PRs only show that runnerq-spec main has moved.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    labels: [deps]
